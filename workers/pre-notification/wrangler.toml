name = "zg-pre-notification"
main = "src/index.js"
compatibility_date = "2025-11-01"

# Cron: täglich 07:00 UTC = 08:00 Berlin Winter / 09:00 Berlin Sommer.
# Mail landet also am Vortag im Posteingang und erfüllt damit die
# "spätestens 1 Tag vor Belastung"-Zusage aus dem SEPA-Mandat.
[triggers]
crons = ["0 7 * * *"]

# KV-Binding wird NICHT hier konfiguriert, sondern nach dem ersten
# Deploy im Dashboard eingerichtet (Worker → Settings → Bindings →
# Add → KV Namespace: Variable "SEPA_MANDATES", Namespace sepa-mandates).
# Grund: Namespace-ID ist pro Account spezifisch, wäre im Repo nicht
# sauber zu hinterlegen.
#
# Env Vars werden ebenfalls im Cloudflare-Dashboard gesetzt. Pflicht:
#   BREVO_API_KEY        (secret)
#   CRON_TRIGGER_TOKEN   (secret — nur für manuellen HTTP-Trigger)
# Optional:
#   FROM_EMAIL           (default: "Zentrum Grundrechte <kontakt@zentrumgrundrechte.de>")
#   ADMIN_EMAIL          (default: "kontakt@zentrumgrundrechte.de")
