name = "zg-pre-notification"
main = "src/index.js"
compatibility_date = "2025-11-01"

# Cron: täglich 07:00 UTC = 08:00 Berlin Winter / 09:00 Berlin Sommer.
# Mail landet also am Vortag im Posteingang und erfüllt damit die
# "spätestens 1 Tag vor Belastung"-Zusage aus dem SEPA-Mandat.
[triggers]
crons = ["0 7 * * *"]

# KV-Binding — identisch zum Pages-Projekt (Namespace "sepa-mandates"),
# damit Worker + Pages Function denselben Datenbestand sehen.
[[kv_namespaces]]
binding = "SEPA_MANDATES"
id = "b150662edcb044899c9e357eb7ae8b5e"

# Env Vars werden im Cloudflare-Dashboard gesetzt (nicht hier im Repo).
# Pflicht:
#   BREVO_API_KEY        (secret)
#   CRON_TRIGGER_TOKEN   (secret — nur für manuellen HTTP-Trigger)
# Optional:
#   FROM_EMAIL           (default: "Zentrum Grundrechte <kontakt@zentrumgrundrechte.de>")
#   ADMIN_EMAIL          (default: "kontakt@zentrumgrundrechte.de")
